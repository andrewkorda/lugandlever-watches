spring:
  application:
    name: lugandlever-backend
  profiles:
    active: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB:watch_db}
    username: ${POSTGRES_USER:watch_user}
    password: ${POSTGRES_PASSWORD:watch_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration